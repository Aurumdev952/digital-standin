[workspace]
resolver = "3"
members = ["crates/*", "app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
crossbeam-channel = "0.5"
arc-swap = "1"
parking_lot = "0.12"
rayon = "1"
rand = "0.9"
tracing = "0.1"
spin_sleep = "1"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 3
